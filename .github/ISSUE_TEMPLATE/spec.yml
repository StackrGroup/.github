name: Spec
description: "Le PRD d'un comportement à développer, prêt au sens de CONTRIBUTING.md. Titre : « Module : comportement »."
body:
  - type: markdown
    attributes:
      value: >-
        Ce PRD est la seule spec du changement et n'est plus maintenu après la livraison.

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Le module, le code concerné (fichier, fonction, écran) et pourquoi le changement est utile.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critères d'acceptation
      description: |
        Format EARS, un critère par ligne, numéroté (CA1, CA2…) ; chacun est un scénario de test.
        Formes : `Quand <événement>, l'application <réponse>`, `Tant que <état>, …`,
        `Si <condition>, alors …`, `Là où <option>, …` ou `L'application doit …`.
        Au moins un `Si …, alors …` d'erreur ou de refus. Exemple :

        - CA1 — Quand l'utilisateur valide le formulaire, l'application enregistre la demande et affiche sa référence.
        - CA2 — Tant que la demande est en brouillon, l'application permet de la modifier.
        - CA3 — Si le montant est négatif, alors l'application refuse la demande et affiche « Montant invalide ».
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Hors-scope
      description: Ce que le changement ne couvre pas, même proche, et ce qui doit rester identique.
    validations:
      required: true

  - type: textarea
    id: existing-behavior
    attributes:
      label: Comportement existant
      description: >-
        Application remplacée, s'il y en a une : son comportement (lien), reproduit ou écart justifié.
        « Sans objet » sinon.
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Maquette
      description: Lien Figma ou Storybook si un écran change ; « Sans objet » sinon.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances
      description: Autre ticket, ADR. « Aucune » sinon.
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: Prête
      description: Une issue qui ne coche pas tout reste possible, mais n'est pas encore prête.
      options:
        - label: Les dépendances sont levées (ADR « Accepté »).
        - label: Tient en trois jours-homme au plus.
        - label: Le PRD tient en 30 à 50 lignes de Markdown, sinon découper le ticket.
        - label: Ne contient ni secret ni donnée client, y compris dans les exemples et les captures.
          required: true
